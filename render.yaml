# Render Blueprint — backend only. https://render.com/docs/blueprint-spec
#
# Frontend deploys separately to Vercel (frontend-react/vercel.json).
# Uses the repo's Dockerfile directly, no card required for the free tier.

services:
  - type: web
    name: pharma-forecast-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false   # set to the Vercel URL once known, e.g. https://pharma-forecast.vercel.app
      - key: API_KEYS
        sync: false   # set manually in the Render dashboard after first deploy
